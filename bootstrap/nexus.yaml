apiVersion: v1
kind: Namespace
metadata:
  name: nexus
  labels:
    argocd.argoproj.io/managed-by: openshift-gitops
---
# Permit UID 200 only through the nonroot-v2 SCC, for the Nexus SA only.
# Apply this bootstrap file as cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nexus-use-nonroot-v2
  namespace: nexus
rules:
  - apiGroups: [security.openshift.io]
    resources: [securitycontextconstraints]
    resourceNames: [nonroot-v2]
    verbs: [use]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nexus-use-nonroot-v2
  namespace: nexus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nexus-use-nonroot-v2
subjects:
  - kind: ServiceAccount
    name: nexus
    namespace: nexus

