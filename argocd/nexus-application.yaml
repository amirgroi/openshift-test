apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexus
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/amirgroi/openshift-test.git
    targetRevision: main
    path: apps/nexus
  destination:
    server: https://kubernetes.default.svc
    namespace: nexus
  syncPolicy:
    syncOptions:
      - PruneLast=true

